# Configuracion MP
app.name=app-books
app.title=App Books

consul.host=127.0.0.1
consul.port=8500

# stork://<servicio>: la URL real se resuelve en Consul
app.authors.url=stork://app-authors
com.programacion.distribuida.books.clients.AuthorRestClient/mp-rest/url=${app.authors.url}
AuthorRestClient/mp-rest/url=${app.authors.url}

# Stork: descubrimiento en Consul y balanceo round-robin
quarkus.stork.app-authors.service-discovery.type=consul
quarkus.stork.app-authors.service-discovery.consul-host=${consul.host}
quarkus.stork.app-authors.service-discovery.consul-port=${consul.port}
quarkus.stork.app-authors.service-discovery.refresh-period=5s
quarkus.stork.app-authors.load-balancer.type=round-robin
